- id: strict-kwargs
  name: strict-kwargs
  description: Enforce keyword arguments at call sites.
  # `check` is required: the CLI sets `subcommand_required`, so without it
  # pre-commit's appended filenames are parsed as a subcommand name and every
  # run fails with `error: unrecognized subcommand` (exit 2).
  entry: strict-kwargs check
  language: python
  # `strict-kwargs check` reports on `.pyi` as well as `.py`, but pre-commit's
  # `python` tag matches only `.py`, so stubs were silently skipped.
  types_or: [python, pyi]
  # strict-kwargs does one-time import-closure indexing per invocation, so a
  # single process over all files is faster than pre-commit's default
  # batched/parallel invocation.
  require_serial: true
