---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deny by default; each job opts into the minimum scope it needs.
permissions: {}

# A force-push supersedes the run it interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: pre-commit/action@v3.0.1

  test:
    name: update.py (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The floor from requires-python, and the version mirror.yml runs on.
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Run the tests
        run: uv run --group dev --python ${{ matrix.python-version }} pytest

  hook:
    # The consumer path: pre-commit builds this package, resolves the wheel
    # from PyPI and runs the hook. Every platform strict-kwargs publishes a
    # wheel for is covered, because "the wheel exists" is exactly what this
    # mirror promises.
    name: Hook end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Install pre-commit
        run: uv tool install pre-commit

      - name: Run the hook against a throwaway consumer project
        shell: bash
        run: tests/e2e.sh
