---
name: Dependabot auto-merge

# Triggered by CI finishing, not by `pull_request`.
#
# `gh pr merge --auto` only waits for checks that branch protection marks as
# *required*; with no protection rule configured it merges the PR on the spot,
# which is what this repo was doing. Keying off the CI run is what actually
# holds the merge back. Enabling branch protection with CI required is still
# worth doing -- it closes the same hole for human PRs -- but it is repo
# settings, not something a commit can do.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Deny by default; the job opts into the minimum scope it needs.
permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    permissions:
      # Merge the pull request and delete its branch.
      contents: write
      pull-requests: write

    steps:
      - name: Merge the Dependabot PR that CI just passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request associated with this run; nothing to merge."
            exit 0
          fi

          # Re-read author and head from the API rather than trusting the
          # workflow_run payload, which describes the run that finished, not
          # the current state of the branch it is about to merge.
          author="$(gh pr view "$PR_NUMBER" --json author --jq .author.login)"
          head="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"

          case "$author" in
            'dependabot[bot]' | 'app/dependabot') ;;
            *)
              echo "PR #${PR_NUMBER} is authored by ${author}, not Dependabot."
              exit 0
              ;;
          esac

          # Commits pushed after CI started would otherwise be merged untested.
          if [ "$head" != "$TESTED_SHA" ]; then
            echo "PR #${PR_NUMBER} is now at ${head}; CI ran on ${TESTED_SHA}."
            echo "Skipping: the merge candidate is not what was tested."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --merge --delete-branch
