---
name: Mirror strict-kwargs releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          strict-kwargs version to mirror. Leave empty for the latest release
          on PyPI. Accepts either tag form (2026.8.27-post.2 or
          2026.8.27.post2).
        type: string
        required: false
        default: ''
  repository_dispatch:
    types: [strict-kwargs-released]
  schedule:
    # Daily at 02:00 UTC. '*' is special in YAML, so the string is quoted.
    - cron: 0 2 * * *

# Deny by default; the job opts into the minimum scope it needs.
permissions: {}

# One mirror run at a time. The schedule, a release's repository_dispatch and
# a manual run can otherwise overlap and race each other to push the same
# bump commit and tag. Queue rather than cancel: an interrupted run could be
# midway through publishing.
concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest

    permissions:
      # Push the version bump + tag and create the matching release.
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Credentials must persist so the bump commit/tag can be pushed.
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # For `uv tool install pre-commit` in the end-to-end check below.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Sync to the requested strict-kwargs release
        id: sync
        env:
          # A manual run's input wins; otherwise the version a
          # repository_dispatch carried; otherwise empty, meaning "latest".
          VERSION: >-
            ${{ inputs.version || github.event.client_payload.version }}
        run: |
          if [ -n "$VERSION" ]; then
            result="$(python update.py "$VERSION")"
          else
            result="$(python update.py)"
          fi
          echo "$result"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already published
        id: guard
        if: startsWith(steps.sync.outputs.result, 'changed=')
        env:
          RESULT: ${{ steps.sync.outputs.result }}
        run: |
          version="${RESULT#changed=}"

          # Ask the remote, not the local clone: actions/checkout defaults to
          # fetch-depth 1 and fetch-tags false, so no tags exist here and a
          # local rev-parse would report "missing" for every tag, including
          # ones that are already published.
          if git ls-remote --exit-code --tags origin "refs/tags/${version}" \
              >/dev/null 2>&1; then
            echo "Tag ${version} already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the bump
        if: steps.guard.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml README.md
          git commit -m "Mirror strict-kwargs ${VERSION}"

      - name: Check the release publishes a wheel for every platform
        if: steps.guard.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/strict-kwargs/{version}/json"
          with urllib.request.urlopen(url, timeout=30) as response:  # noqa: S310
              data = json.load(response)

          wheels = [
              file["filename"]
              for file in data["urls"]
              if file["filename"].endswith(".whl") and not file.get("yanked", False)
          ]
          print("Published wheels:", *wheels, sep="\n  ")

          # The whole point of this mirror is that a consumer never needs a
          # Rust toolchain. A release missing a wheel breaks that promise on
          # that platform, and there is no sdist to fall back to.
          # Matched on fragments rather than exact tags: the glibc and macOS
          # floors move when the build images do, and pinning them here would
          # fail a release for a reason that is not a problem.
          required = [
              (("manylinux", "x86_64"), "Linux x86_64"),
              (("manylinux", "aarch64"), "Linux aarch64"),
              (("macosx", "arm64"), "macOS arm64"),
              (("macosx", "x86_64"), "macOS x86_64"),
              (("win_amd64",), "Windows x86_64"),
          ]
          missing = [
              label
              for fragments, label in required
              if not any(
                  all(fragment in wheel for fragment in fragments) for wheel in wheels
              )
          ]
          if missing:
              sys.exit(f"error: {version} publishes no wheel for: {', '.join(missing)}")
          PY

      - name: Run the hook end to end at the new version
        if: steps.guard.outputs.publish == 'true'
        run: |
          uv tool install pre-commit
          # e2e.sh pins the consumer to this checkout's HEAD, which is now the
          # bump commit, so this exercises the version about to be tagged.
          tests/e2e.sh

      - name: Tag, push and release
        if: steps.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          git tag "${VERSION}"

          # Atomic: a rejected tag must not leave a bump commit on main with
          # no matching tag or release.
          git push --atomic origin HEAD "refs/tags/${VERSION}"

          # Upstream tags a post-release as `-post.N`; PyPI (and so this
          # mirror) normalises it to `.postN`. Linking the unconverted string
          # produced a 404 for every post-release.
          upstream_tag="${VERSION/.post/-post.}"
          upstream_url="https://github.com/adamtheturtle/strict-kwargs/releases/tag/${upstream_tag}"

          notes="${RUNNER_TEMP}/release-notes.md"
          printf 'Mirror of [strict-kwargs %s](%s).\n' "${VERSION}" "${upstream_url}" \
            > "${notes}"

          # Best effort: a missing or empty upstream release still publishes.
          if body="$(gh release view "${upstream_tag}" \
              --repo adamtheturtle/strict-kwargs --json body --jq .body 2>/dev/null)" \
              && [ -n "${body}" ]; then
            {
              printf '\n---\n\n## Upstream release notes\n\n'
              printf '%s\n' "${body}"
            } >> "${notes}"
          fi

          gh release create "${VERSION}" --title "${VERSION}" --notes-file "${notes}"
