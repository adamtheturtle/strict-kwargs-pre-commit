# This package is intentionally code-free. Its only job is to pin a
# dependency on a published `strict-kwargs` wheel so that pre-commit's
# `language: python` installs the prebuilt binary from PyPI, with no Rust
# toolchain required on the machine running the hook.
#
# The package version and the `strict-kwargs==` pin are kept identical and in
# lockstep with the mirrored upstream release by `update.py` (run manually or
# by `.github/workflows/mirror.yml`). Consumers pin the matching git tag via
# `rev:` in their `.pre-commit-config.yaml`.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "strict-kwargs-pre-commit"
version = "2026.8.28.post2"
description = "A pre-commit mirror of strict-kwargs (installs the published PyPI wheel; no Rust toolchain needed)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Adam Dangoor", email = "adamdangoor@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "strict-kwargs==2026.8.28.post2",
]

urls.Source = "https://github.com/adamtheturtle/strict-kwargs-pre-commit"
urls.Upstream = "https://github.com/adamtheturtle/strict-kwargs"

[tool.setuptools]
# No modules: build an empty wheel that exists only to carry the dependency.
py-modules = []

# Test-only; the published wheel stays code-free and carries no dev deps.
[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflicting docstring conventions; pick one of each pair.
    "D203",
    "D213",
    # `update.py` is a CLI: stdout and stderr are its interface.
    "T201",
    # This repo carries no per-file copyright headers.
    "CPY001",
    # Exception messages read fine inline; the indirection these ask for
    # makes short scripts harder to follow, not easier.
    "EM101",
    "EM102",
    "TRY003",
    # Assertions are how tests assert.
    "S101",
    # Ruff's own advice when the formatter is in use: COM812 adds trailing
    # commas that the formatter then removes, so `ruff check --fix` and
    # `ruff format` fight each other and pre-commit never converges.
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers deliberately, and pytest fixtures shadow
# their own names.
# Tests reach into private helpers deliberately; stub callables must accept
# the arguments of what they replace without using them; the suite is not a
# package.
"tests/*" = ["SLF001", "PLR2004", "INP001", "ARG001", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `update.py` sits at the repository root, not in a package.
pythonpath = ["."]
addopts = "--strict-markers -ra"
