---
# Matches the upstream strict-kwargs repo's policy, so the two are consistent.
# Actions are pinned by tag and bumped by Dependabot rather than hash-pinned.
rules:
  unpinned-uses:
    disable: true
  cache-poisoning:
    disable: true
  dependabot-cooldown:
    disable: true
  superfluous-actions:
    disable: true
  artipacked:
    disable: true
